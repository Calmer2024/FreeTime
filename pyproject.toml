[project]
name = "mimo-video-summary-demo"
version = "0.5.0"
description = "Low-cost multimodal information extraction demo for MiMo Trust"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "openai>=1.99,<2",
  "playwright>=1.61,<2",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2026.1.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
