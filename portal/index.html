<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FreeTime - 帮助你节省时间的应用工具箱">
  <title>FreeTime - 节省时间的工具箱</title>
  <link rel="icon" type="image/png" href="/static/icon_freetime.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/style.css">
</head>
<body>
  <div class="portal">
    <!-- 背景装饰 -->
    <div class="bg-decoration">
      <!-- 光点粒子 -->
      <div class="particles" id="particles"></div>
      <!-- 渐变光球 -->
      <div class="gradient-orb orb-1"></div>
      <div class="gradient-orb orb-2"></div>
      <div class="gradient-orb orb-3"></div>
      <div class="gradient-orb orb-4"></div>
    </div>

    <!-- 主内容 -->
    <main class="main-content">
      <!-- 头部 -->
      <header class="header">
        <div class="logo">
          <img src="/static/icon_freetime.png" alt="FreeTime" class="logo-icon" width="64" height="64">
          <h1 class="logo-text">FreeTime</h1>
        </div>
        <p class="tagline">帮助你节省时间的应用工具箱</p>
      </header>

      <!-- 应用卡片网格 -->
      <section class="apps-grid">
        <!-- DrillKnowledge -->
        <a href="/extractor" class="app-card">
          <div class="card-icon">
            <img src="/static/icon_drillknowledge.png" alt="DrillKnowledge" width="48" height="48" style="border-radius: 12px;">
          </div>
          <div class="card-content">
            <h2>DrillKnowledge</h2>
            <p>深度知识提取工具，一键提取抖音、B站、YouTube、快手、微博、小红书、视频号等热门平台的内容，支持视频、图文、直播等多种形式。</p>
            <div class="card-tags">
              <span class="tag">视频提取</span>
              <span class="tag">图文解析</span>
              <span class="tag">一键复制</span>
            </div>
          </div>
          <div class="card-arrow">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </a>

        <!-- 超星刷课助手 -->
        <a href="/chaoxing" class="app-card">
          <div class="card-icon">
            <img src="/static/icon_chaoxing.png" alt="超星刷课助手" width="48" height="48" style="border-radius: 12px;">
          </div>
          <div class="card-content">
            <h2>超星刷课助手</h2>
            <p>自动完成超星学习通课程视频播放，支持倍速播放、自动跳过弹窗、断点续播，让你轻松完成网课任务。</p>
            <div class="card-tags">
              <span class="tag">自动播放</span>
              <span class="tag">倍速刷课</span>
              <span class="tag">弹窗处理</span>
            </div>
          </div>
          <div class="card-arrow">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </a>

        <!-- 更多应用占位 -->
        <div class="app-card coming-soon">
          <div class="card-icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="48" height="48" rx="12" fill="url(#card3-gradient)" opacity="0.5"/>
              <path d="M24 16V32M16 24H32" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              <defs>
                <linearGradient id="card3-gradient" x1="0" y1="0" x2="48" y2="48">
                  <stop stop-color="#6366f1"/>
                  <stop offset="1" stop-color="#8b5cf6"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="card-content">
            <h2>更多应用开发中...</h2>
            <p>我们正在开发更多实用工具，敬请期待！如果你有好的建议，欢迎反馈。</p>
          </div>
        </div>
      </section>

      <!-- 底部 -->
      <footer class="footer">
        <p>FreeTime &copy; 2026 &middot; 帮助你节省时间的工具箱</p>
      </footer>
    </main>
  </div>

  <script>
    // 光点粒子动画
    function createParticles() {
      const container = document.getElementById('particles');
      const particleCount = 30;
      const colors = [
        'rgba(99, 102, 241, 0.6)',   // 紫色
        'rgba(139, 92, 246, 0.5)',   // 深紫
        'rgba(236, 72, 153, 0.5)',   // 粉色
        'rgba(16, 185, 129, 0.4)',   // 绿色
        'rgba(245, 158, 11, 0.4)',   // 金色
        'rgba(255, 255, 255, 0.3)',  // 白色
      ];

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        // 随机大小 (2-6px)
        const size = Math.random() * 4 + 2;

        // 随机位置
        const left = Math.random() * 100;

        // 随机动画时长 (15-35秒)
        const duration = Math.random() * 20 + 15;

        // 随机延迟
        const delay = Math.random() * 20;

        // 随机颜色
        const color = colors[Math.floor(Math.random() * colors.length)];

        particle.style.cssText = `
          width: ${size}px;
          height: ${size}px;
          left: ${left}%;
          background: ${color};
          box-shadow: 0 0 ${size * 2}px ${color};
          animation-duration: ${duration}s;
          animation-delay: -${delay}s;
        `;

        container.appendChild(particle);
      }
    }

    // 页面加载时创建粒子
    document.addEventListener('DOMContentLoaded', createParticles);
  </script>
</body>
</html>
