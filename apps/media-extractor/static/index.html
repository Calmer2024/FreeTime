<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DrillKnowledge - 深度知识提取工具">
  <title>DrillKnowledge - FreeTime</title>
  <link rel="icon" type="image/png" href="/static/icon_freetime.png">
  <link rel="stylesheet" href="/extractor-static/app.css?v=1.0.15">
  <style>
    /* 重置原生浏览器样式 */
    input, select, button, textarea {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      border-radius: 0;
      background: transparent;
      border: none;
      outline: none;
      font: inherit;
    }

    select {
      cursor: pointer;
    }

    /* DrillKnowledge 页面布局 - 无全局滚动 */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* DrillKnowledge 头部布局 - 固定高度 */
    .dk-header {
      flex-shrink: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }

    .dk-header-inner {
      display: flex;
      align-items: center;
      padding: 12px 24px;
      position: relative;
    }

    /* 导航区域 - 固定在左侧 */
    .dk-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      position: absolute;
      left: 24px;
    }

    .dk-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      color: var(--ink-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .dk-back:hover {
      color: var(--ink);
      background: var(--surface-muted);
    }

    .dk-back svg {
      width: 18px;
      height: 18px;
    }

    .dk-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dk-logo-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .dk-logo-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.3px;
    }

    /* 搜索栏容器 - 页面居中 */
    .dk-search-container {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .dk-task-control {
      position: absolute;
      right: 24px;
      z-index: 220;
    }

    /* 内容区域 - 填充剩余空间，内部滚动 */
    .dk-content {
      flex: 1;
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .dk-content-inner {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      padding: 24px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 内容卡片 - 固定高度 */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-panel);
      overflow: hidden;
    }

    .panel.history {
      flex-shrink: 0;
    }

    .panel.workbench {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .result {
      flex: 1;
      min-height: 0;
      height: 100%;
      padding: 0;
    }

    .result.active {
      display: flex;
      flex-direction: column;
    }

    /* 自定义滚动条 - 内部 */
    .dk-content-inner::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .dk-content-inner::-webkit-scrollbar-track {
      background: transparent;
    }

    .dk-content-inner::-webkit-scrollbar-thumb {
      min-height: 44px;
      border: 3px solid transparent;
      border-radius: 999px;
      background: var(--scrollbar-thumb);
      background-clip: content-box;
    }

    .dk-content-inner::-webkit-scrollbar-thumb:hover {
      background-color: var(--scrollbar-thumb-hover);
    }

    /* Firefox 滚动条 */
    .dk-content-inner {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    /* 结果网格布局 - 左侧固定，右侧滚动 */
    .result-grid {
      display: flex;
      height: 100%;
      min-height: 0;
      flex: 1;
    }

    .result-grid .media {
      width: 280px;
      flex-shrink: 0;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    .result-grid .media::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .result-grid .media::-webkit-scrollbar-track {
      background: transparent;
    }

    .result-grid .media::-webkit-scrollbar-thumb {
      min-height: 48px;
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--scrollbar-thumb);
      background-clip: content-box;
    }

    .result-grid .media::-webkit-scrollbar-thumb:hover {
      background-color: var(--scrollbar-thumb-hover);
    }

    .result-grid .analysis {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .result-grid .analysis .result-navigation {
      flex-shrink: 0;
    }

    .result-grid .analysis .result-view {
      padding-right: 8px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    .result-grid .analysis .result-view::-webkit-scrollbar { width: 7px; }
    .result-grid .analysis .result-view::-webkit-scrollbar-track { background: transparent; }
    .result-grid .analysis .result-view::-webkit-scrollbar-thumb {
      min-height: 48px;
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--scrollbar-thumb);
      background-clip: content-box;
    }

    .cleaned-article {
      padding: 16px;
      background: var(--surface-muted);
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.8;
      color: var(--ink);
    }

    /* 自定义下拉框 - 无原生组件 */
    .custom-select-wrapper {
      position: relative;
    }

    .custom-dropdown {
      position: relative;
    }

    .custom-dropdown-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 0 8px;
      height: 100%;
    }

    .custom-dropdown-trigger span {
      font-size: 13px;
      color: var(--ink-secondary);
      white-space: nowrap;
    }

    .custom-dropdown-trigger svg {
      width: 14px;
      height: 14px;
      color: var(--ink-tertiary);
      transition: transform 0.2s ease;
    }

    .custom-dropdown.open .custom-dropdown-trigger svg {
      transform: rotate(180deg);
    }

    .custom-dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 140px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 4px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s ease;
      z-index: 1000;
    }

    .custom-dropdown.open .custom-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .custom-dropdown-option {
      padding: 8px 12px;
      font-size: 13px;
      color: var(--ink-secondary);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .custom-dropdown-option:hover {
      background: var(--surface-muted);
      color: var(--ink);
    }

    .custom-dropdown-option.active {
      background: var(--surface-muted);
      color: var(--ink);
      font-weight: 500;
    }

    /* 输入框样式重置 */
    .field input {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      border-radius: 0;
      background: transparent;
      border: none;
      outline: none;
    }

    /* 窄桌面：导航和搜索分行，避免在最小窗口发生遮挡。 */
    @media (max-width: 1240px) {
      .dk-header-inner {
        align-items: stretch;
        flex-direction: column;
        gap: 8px;
        padding: 10px 16px;
      }

      .dk-nav {
        position: static;
        min-width: 0;
      }

      .dk-logo-text {
        display: none;
      }

      .dk-search-container {
        width: 100%;
      }

      .dk-task-control {
        top: 10px;
        right: 16px;
      }

      .dk-content-inner {
        height: auto;
        min-height: 100%;
        padding: 14px 12px 24px;
      }

      .panel.workbench,
      .result,
      .result-grid,
      .result-grid .analysis {
        height: auto;
        overflow: visible;
      }

      .panel.workbench { flex: 0 0 auto; }
      .result-grid { flex-direction: column; }
      .result-grid .media {
        width: 100%;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }

    @media (max-height: 620px) and (min-width: 1241px) {
      .dk-header-inner { padding-top: 8px; padding-bottom: 8px; }
      .dk-content-inner { padding-top: 12px; padding-bottom: 12px; gap: 12px; }
      .result-grid .media { width: 240px; padding: 18px; }
      .result-grid .analysis { padding: 20px 22px 24px; }
      .result-navigation { margin-bottom: 16px; }
    }

    @media (min-width: 1800px) and (min-height: 900px) {
      .dk-content-inner { max-width: 1440px; }
      .dk-search-container .command-bar { max-width: 820px !important; }
      .result-grid .media { width: 340px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 顶部导航栏 -->
    <header class="dk-header">
      <div class="dk-header-inner">
        <!-- 导航区域：返回按钮 + Logo -->
        <nav class="dk-nav">
          <a href="/" class="dk-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>FreeTime</span>
          </a>
          <div class="dk-logo">
            <img src="/static/icon_drillknowledge.png" alt="DrillKnowledge" class="dk-logo-icon" width="32" height="32">
            <span class="dk-logo-text">DrillKnowledge</span>
          </div>
        </nav>

        <!-- 搜索栏 -->
        <div class="dk-search-container">
          <form class="command-bar" id="form" style="margin: 0; width: 100%; max-width: 680px;">
            <div class="command-inner">
              <label class="sr-only" for="url">粘贴链接或分享文本</label>
              <div class="field input-field">
                <i class="ui-icon" data-lucide="search" aria-hidden="true"></i>
                <input id="url" type="text" autocomplete="off" maxlength="10000"
                  placeholder="粘贴链接；可连续提交多个任务">
                <button class="help-button tooltip" type="button" aria-label="支持的输入"
                  data-tooltip="支持直接输入文字，以及文章、快手、微博、小红书、视频号、抖音、B站和 YouTube 链接。">
                  <i data-lucide="circle-help" aria-hidden="true"></i>
                </button>
              </div>
              <div class="field select-field custom-select-wrapper">
                <i class="ui-icon" data-lucide="scan-search" aria-hidden="true"></i>
                <div class="custom-dropdown" id="modeDropdown">
                  <div class="custom-dropdown-trigger" id="modeTrigger">
                    <span id="modeValue">智能提取</span>
                    <i data-lucide="chevron-down" aria-hidden="true"></i>
                  </div>
                  <div class="custom-dropdown-menu" id="modeMenu">
                    <div class="custom-dropdown-option active" data-value="auto">智能提取</div>
                    <div class="custom-dropdown-option" data-value="visual">全模态</div>
                  </div>
                </div>
                <input type="hidden" id="mode" value="auto">
              </div>
              <button class="primary-button tooltip" id="submit" type="submit"
                aria-label="开始提取" data-tooltip="开始提取">
                <i class="button-icon" data-lucide="scan-line" aria-hidden="true"></i>
              </button>
            </div>
          </form>
        </div>
        <div class="dk-task-control" id="task-queue-control" hidden>
          <button class="task-queue-trigger" id="toggle-task-queue" type="button"
            aria-label="展开并行任务" title="展开并行任务" aria-expanded="false"
            aria-controls="task-queue">
            <i data-lucide="list-checks" aria-hidden="true"></i>
            <span class="task-active-badge" id="task-active-badge" hidden></span>
          </button>
          <section class="task-queue" id="task-queue" aria-label="并行任务" hidden>
            <div class="task-queue-heading">
              <div><strong>并行任务</strong><span class="task-queue-summary" id="task-queue-summary"></span></div>
              <div class="task-queue-clear-actions" id="task-queue-clear-actions"></div>
            </div>
            <div class="task-list" id="task-list"></div>
          </section>
        </div>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="dk-content" id="content-scroll">
      <div class="dk-content-inner">
      <!-- 加载状态 -->
      <section class="panel workbench" id="workbench" aria-live="polite" hidden>
        <div class="loading" id="loading">
          <div class="loading-head">
            <div class="loading-state">
              <span class="spinner" aria-hidden="true"></span>
              <strong id="loading-label">正在解析链接</strong>
            </div>
            <span class="timer" id="timer">0.0s</span>
          </div>
          <div class="skeleton skeleton-wide"></div>
          <div class="skeleton skeleton-medium"></div>
          <div class="skeleton skeleton-short"></div>
        </div>

        <!-- 结果展示 -->
        <div class="result" id="result">
          <div class="result-grid">
            <aside class="media">
              <div class="thumbnail-frame">
                <img class="thumbnail" id="thumbnail" alt="内容封面" hidden>
                <div class="thumbnail-placeholder" id="thumbnail-placeholder">
                  <i data-lucide="image-off" aria-hidden="true"></i>
                  <span>暂无可用封面</span>
                </div>
              </div>
              <button class="download-button" id="download-thumbnail" type="button" aria-label="下载封面图片" hidden>
                <i data-lucide="download" aria-hidden="true"></i>
                <span>下载封面</span>
              </button>
              <div class="media-gallery" id="media-gallery" hidden></div>
              <div class="eyebrow" id="platform"></div>
              <h1 class="video-title" id="video-title"></h1>
              <div class="meta" id="meta"></div>
              <button class="copy-button" id="copy-content" type="button" aria-label="一键复制内容">
                <i data-lucide="copy" aria-hidden="true"></i>
                <span>一键复制</span>
              </button>
            </aside>

            <article class="analysis">
              <div class="result-navigation">
                <div class="result-tabs" role="tablist" aria-label="结果视图">
                  <button class="result-tab active" id="tab-overview" type="button" role="tab"
                    aria-selected="true" aria-controls="view-overview" data-result-view="overview">
                    <i data-lucide="align-left" aria-hidden="true"></i><span>概览</span>
                  </button>
                  <button class="result-tab" id="tab-article" type="button" role="tab"
                    aria-selected="false" aria-controls="view-article" data-result-view="article">
                    <i data-lucide="file-text" aria-hidden="true"></i><span>完整全文</span>
                  </button>
                  <button class="result-tab" id="tab-resources" type="button" role="tab"
                    aria-selected="false" aria-controls="view-resources" data-result-view="resources" hidden>
                    <i data-lucide="images" aria-hidden="true"></i><span>资源</span>
                  </button>
                  <button class="result-tab" id="tab-process" type="button" role="tab"
                    aria-selected="false" aria-controls="view-process" data-result-view="process">
                    <i data-lucide="activity" aria-hidden="true"></i><span>处理详情</span>
                  </button>
                </div>
                <span class="strategy" id="strategy"></span>
              </div>

              <section class="result-view active" id="view-overview" role="tabpanel"
                aria-labelledby="tab-overview" data-view-panel="overview">
                <section class="view-section overview-trace">
                  <div class="section-heading">
                    <div>
                      <i class="section-icon" data-lucide="workflow" aria-hidden="true"></i>
                      <h2>处理轨迹</h2>
                    </div>
                  </div>
                  <div class="trace" id="trace"></div>
                </section>
                <section class="view-section">
                  <div class="section-heading">
                    <div>
                      <i class="section-icon" data-lucide="align-left" aria-hidden="true"></i>
                      <h2>内容概括</h2>
                    </div>
                  </div>
                  <p class="summary" id="summary"></p>
                  <div class="coverage" id="coverage"></div>
                  <div class="points" id="points"></div>
                  <div class="topics" id="topics"></div>
                </section>
                <section class="view-section" id="resources-section" hidden>
                  <div class="section-heading"><div><i class="section-icon" data-lucide="link-2" aria-hidden="true"></i><h2>相关资源</h2></div></div>
                  <div class="resource-list" id="resources-list"></div>
                </section>
                <section class="view-section" id="opinion-section" hidden>
                  <div class="section-heading"><div><i class="section-icon" data-lucide="shield-check" aria-hidden="true"></i><h2>观点判断</h2></div></div>
                  <div class="opinion-assessment" id="opinion-assessment"></div>
                </section>
              </section>

              <section class="result-view" id="view-article" role="tabpanel"
                aria-labelledby="tab-article" data-view-panel="article" hidden>
                <div class="section-heading article-column-heading">
                  <div>
                    <i class="section-icon" data-lucide="file-text" aria-hidden="true"></i>
                    <div class="article-column-tabs" role="tablist" aria-label="全文内容栏目">
                      <button class="article-column-tab active" id="article-tab-polished" type="button" role="tab"
                        aria-selected="true" aria-controls="article-pane-polished" data-article-view="polished">完整全文</button>
                      <button class="article-column-tab" id="article-tab-source" type="button" role="tab"
                        aria-selected="false" aria-controls="article-pane-source" data-article-view="source">提取原文</button>
                    </div>
                  </div>
                  <div class="article-actions">
                    <span class="download-status" id="article-download-status" aria-live="polite" hidden></span>
                    <button class="copy-button-sm" id="export-article-md" type="button" aria-label="导出完整全文 Markdown 文件">
                      <i data-lucide="download" aria-hidden="true"></i>
                      <span>导出 .md</span>
                    </button>
                    <button class="copy-button-sm" id="copy-article" type="button" aria-label="复制当前全文栏目">
                      <i data-lucide="copy" aria-hidden="true"></i>
                      <span>复制</span>
                    </button>
                  </div>
                </div>
                <div class="article-column-pane active" id="article-pane-polished" role="tabpanel"
                  aria-labelledby="article-tab-polished" data-article-panel="polished">
                  <article class="cleaned-article" id="cleaned-article"></article>
                </div>
                <div class="article-column-pane" id="article-pane-source" role="tabpanel"
                  aria-labelledby="article-tab-source" data-article-panel="source" hidden>
                  <article class="raw-source-article" id="raw-source-text"></article>
                </div>
              </section>

              <section class="result-view" id="view-resources" role="tabpanel"
                aria-labelledby="tab-resources" data-view-panel="resources" hidden>
                <div class="section-heading">
                  <div><i class="section-icon" data-lucide="images" aria-hidden="true"></i><h2>图片资源</h2></div>
                  <div class="resource-actions">
                    <span class="download-status" id="download-status" aria-live="polite" hidden></span>
                    <button class="resource-action-button" id="download-all-resources" type="button"><i data-lucide="download" aria-hidden="true"></i><span>一键下载</span></button>
                    <button class="icon-button" id="download-settings-button" type="button" aria-label="下载目录设置" title="下载目录设置"><i data-lucide="folder-cog" aria-hidden="true"></i></button>
                  </div>
                </div>
                <p class="resource-view-note" id="resource-view-note"></p>
                <div class="resource-gallery" id="resource-gallery"></div>
              </section>

              <section class="result-view" id="view-process" role="tabpanel"
                aria-labelledby="tab-process" data-view-panel="process" hidden>
                <section class="view-section">
                  <div class="section-heading">
                    <div>
                      <i class="section-icon" data-lucide="timer" aria-hidden="true"></i>
                      <h2>全流程总览</h2>
                    </div>
                  </div>
                  <div class="pipeline-summary" id="full-pipeline-summary"></div>
                  <div class="trace process-trace" id="process-trace"></div>
                </section>
                <section class="view-section">
                  <div class="section-heading">
                    <div>
                      <i class="section-icon" data-lucide="gauge" aria-hidden="true"></i>
                      <h2>信息提取覆盖</h2>
                    </div>
                  </div>
                  <div class="plan-badges" id="plan-badges"></div>
                  <div class="coverage-grid" id="coverage-grid"></div>
                </section>
                <section class="view-section">
                  <div class="section-heading">
                    <div>
                      <i class="section-icon" data-lucide="layers-3" aria-hidden="true"></i>
                      <h2>成本阶梯</h2>
                    </div>
                  </div>
                  <div class="cost-ladder" id="cost-ladder"></div>
                </section>
                <section class="view-section">
                  <div class="section-heading">
                    <div>
                      <i class="section-icon" data-lucide="scan-text" aria-hidden="true"></i>
                      <h2>关键帧 OCR</h2>
                    </div>
                  </div>
                  <div class="keyframe-list" id="keyframes"></div>
                </section>
              </section>
            </article>
          </div>
        </div>

        <div class="error" id="error" role="alert"></div>
      </section>

      <!-- 历史记录 -->
      <section class="panel history">
        <div class="history-head">
          <div class="section-heading">
            <div><i class="section-icon" data-lucide="history" aria-hidden="true"></i><h2>最近提取</h2></div>
          </div>
          <div class="history-actions-head">
            <button class="icon-button history-toggle" id="toggle-history" type="button" aria-label="折叠最近提取" title="折叠最近提取"><i data-lucide="chevron-up" aria-hidden="true"></i></button>
            <button class="icon-button danger-quiet tooltip" id="clear-history" type="button" aria-label="清空全部缓存" data-tooltip="清空全部缓存"><i data-lucide="trash-2" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="history-list" id="history-list">
          <div class="history-empty">正在读取记录</div>
        </div>
      </section>
      </div>
    </main>
  </div>

  <div class="app-modal" id="download-settings-modal" hidden>
    <div class="app-modal-backdrop" data-close-download-settings></div>
    <section class="app-modal-card" role="dialog" aria-modal="true" aria-labelledby="download-settings-title">
      <div class="app-modal-header"><div><i data-lucide="folder-cog" aria-hidden="true"></i><h2 id="download-settings-title">下载目录</h2></div><button class="icon-button" type="button" data-close-download-settings aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <div class="app-modal-body"><label for="download-directory">资源将直接保存到此目录</label><input id="download-directory" type="text" autocomplete="off"></div>
      <div class="app-modal-footer"><button class="secondary-button" id="open-download-folder" type="button"><i data-lucide="folder-open" aria-hidden="true"></i>打开目录</button><button class="primary-text-button" id="save-download-settings" type="button"><i data-lucide="check" aria-hidden="true"></i>保存</button></div>
    </section>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="/extractor-static/task-ui.js?v=1.0.15"></script>
  <script src="/extractor-static/app.js?v=1.0.15"></script>
  <script>
    // 自定义下拉框 - 模式选择
    const modeDropdown = document.getElementById('modeDropdown');
    const modeTrigger = document.getElementById('modeTrigger');
    const modeMenu = document.getElementById('modeMenu');
    const modeInput = document.getElementById('mode');
    const modeValue = document.getElementById('modeValue');

    modeTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      modeDropdown.classList.toggle('open');
    });

    modeMenu.querySelectorAll('.custom-dropdown-option').forEach(option => {
      option.addEventListener('click', () => {
        modeInput.value = option.dataset.value;
        modeValue.textContent = option.textContent;
        modeMenu.querySelectorAll('.custom-dropdown-option').forEach(opt => {
          opt.classList.toggle('active', opt === option);
        });
        modeDropdown.classList.remove('open');
      });
    });

    // 点击外部关闭下拉框
    document.addEventListener('click', () => {
      modeDropdown.classList.remove('open');
    });
  </script>
</body>
</html>
